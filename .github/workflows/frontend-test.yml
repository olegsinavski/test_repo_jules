name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-test.yml'

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8 # Specify pnpm version
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Or latest LTS
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install
    - name: Build frontend
      run: pnpm run build:frontend # Uses the script from root package.json
    # Add linting or other checks if desired
    # - name: Lint frontend
    #   run: pnpm run lint:frontend
